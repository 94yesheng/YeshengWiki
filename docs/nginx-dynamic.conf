upstream blog_node {
    server 127.0.0.1:4322;
    keepalive 16;
}

server {
    listen 80;
    server_name www.yesheng.wiki yesheng.wiki;

    root /var/www/blog-app/dist-dynamic/client;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 30m;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json application/xml
               application/rss+xml image/svg+xml;

    location /uploads/ {
        alias /var/www/blog-data/uploads/;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ^~ /artifact/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ^~ /.well-known/ {
        allow all;
    }

    # 旧 Sveltia 后台已退役；统一跳到新 studio
    location ^~ /admin/ {
        return 301 /studio/;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri @node;
    }

    location @node {
        proxy_pass http://blog_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
