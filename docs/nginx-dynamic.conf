# 路径按实际部署目录替换（本文档示例使用 /srv）。
upstream blog_node {
    server 127.0.0.1:4322;
    keepalive 16;
}

server {
    listen 80;
    server_name www.yesheng.wiki yesheng.wiki;

    root /srv/blog-app/dist-dynamic/client;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 30m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json application/xml
               application/rss+xml image/svg+xml;

    location /uploads/ {
        alias /srv/blog-data/uploads/;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        access_log off;
    }

    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location ^~ /artifact/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location ^~ /.well-known/ {
        allow all;
    }

    # 旧 Sveltia 后台已退役；统一跳到新 studio
    location ^~ /admin/ {
        return 301 /studio/;
    }

    # 旧 WordPress 链接（/?p=ID、中文百分号 slug、/?page_id=ID）的 301 在应用层：
    # src/server/legacy-redirects.ts（middleware 路由前处理）。这里不要再用 map 写一份，
    # 否则部署脚本推代码时映射不会跟着更新。

    location ~ /\. {
        deny all;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri @node;
    }

    location @node {
        proxy_pass http://blog_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
