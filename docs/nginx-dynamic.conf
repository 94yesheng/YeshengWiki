# 路径按实际部署目录替换（本文档示例使用 /srv）。
# 注意：请在 /etc/nginx/nginx.conf 的顶层 `http {}` 块中同时配置 `server_tokens off;`，
# 确保 Certbot 自动生成的 80 端口 HTTP->HTTPS 301 跳转块也不会泄露 Nginx 版本号。

upstream blog_node {
    server 127.0.0.1:4322;
    keepalive 16;
}

server {
    listen 80;
    server_name www.yesheng.wiki yesheng.wiki;

    root /srv/blog-app/dist-dynamic/client;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 30m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json application/xml
               application/rss+xml image/svg+xml;

    location /uploads/ {
        alias /srv/blog-data/uploads/;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        access_log off;
    }

    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location ^~ /artifact/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location ^~ /.well-known/ {
        allow all;
    }

    # 旧 Sveltia 后台已退役；统一跳到新 studio
    location ^~ /admin/ {
        return 301 /studio/;
    }

    # 可选加固：若需要为后台入口叠加 IP 白名单或 Basic Auth，可取消下方注释：
    # location ~ ^/studio(-v2)?(/|$) {
    #     # allow <YOUR_TRUSTED_IP>;
    #     # deny all;
    #     # auth_basic "Studio Restricted";
    #     # auth_basic_user_file /etc/nginx/.htpasswd;
    #     try_files $uri @node;
    # }

    # 旧 WordPress 链接（/?p=ID、中文百分号 slug、/?page_id=ID）的 301 在应用层：
    # src/server/legacy-redirects.ts（middleware 路由前处理）。这里不要再用 map 写一份，
    # 否则部署脚本推代码时映射不会跟着更新。

    location ~ /\. {
        deny all;
    }

    # 动态页面与静态根目录文件：
    # 安全响应头（HSTS / CSP / X-Frame-Options / X-Content-Type-Options / Referrer-Policy / Permissions-Policy）
    # 已由 Node 层 src/middleware.ts 统一设置；此处不再重复 add_header，彻底消除 `nosniff, nosniff` 拼接失效问题。
    location / {
        try_files $uri @node;
    }

    location @node {
        proxy_pass http://blog_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 强制使用真实 TCP 连接地址覆盖，并清空客户端可伪造的 CDN 头，防止绕过登录限流
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Ali-CDN-Real-IP "";
        proxy_set_header EO-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
