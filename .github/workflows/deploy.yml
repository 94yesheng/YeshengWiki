# 类型检查与 SSR 构建
#
# 动态版不再走“构建后 FTP 上传静态文件”的流水线：
# 生产由 systemd 跑 `dist-dynamic/server/entry.mjs`，Nginx 反代。
# 这个工作流只做校验，防止把坏代码/坏类型推到 main。
#
# 部署仍按 docs/cutover.md：服务器上拉源码 → npm ci → build:dynamic → 重启 blog。

name: 类型检查与 SSR 构建

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 取出仓库
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # astro build 本身不做类型检查；这一步拦住坏数据/坏类型
      - name: 类型检查
        run: npm run check

      - name: SSR 构建
        run: npm run build:dynamic
