<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>统计</title>
  <style>
/* ==========================================================================
   设计变量 —— 继承自夜笙的小世界 (tokens.css)
   ========================================================================== */
@font-face {
  font-family: 'KaiDigits';
  src: local('KaiTi'), local('楷体'), local('STKaiti'), local('Kaiti SC'), local('Noto Serif SC');
  unicode-range: U+0000-002F, U+003A-10FFFF;
}
@font-face {
  font-family: 'KaiDigits';
  src: local('Microsoft YaHei'), local('Noto Sans SC'), local('PingFang SC'), local('Helvetica Neue'), local(Arial);
  unicode-range: U+0030-0039;
}
@font-face {
  font-family: 'SongDigits';
  src: local('Songti SC'), local('SimSun'), local('宋体'), local('Noto Serif SC');
  unicode-range: U+0000-002F, U+003A-10FFFF;
}
@font-face {
  font-family: 'SongDigits';
  src: local('Microsoft YaHei'), local('Noto Sans SC'), local('PingFang SC'), local('Helvetica Neue'), local(Arial);
  unicode-range: U+0030-0039;
}

:root {
  --paper: #faf9f5;
  --canvas: #f0eee6;
  --ink:   #141413;
  --muted: #6b6862;
  --faint: #b0aea5;
  --rule:  #e8e6dc;
  --accent: #d97757;       /* 主题色 rgb(217, 119, 87) */
  --accent-light: #fccdbc; /* 稍浅的主题色（用于地球描边粒子与高亮） */
  --pine:  #788c5d;
  --code-bg: #f0eee6;
  --code-block: #f4f2ea;

  --kai:  'KaiDigits', KaiTi, 楷体, STKaiti, "Kaiti SC", "Noto Serif SC", serif;
  --song: 'SongDigits', "Songti SC", SimSun, 宋体, "Noto Serif SC", serif;
  --sans: "Noto Sans SC", "Microsoft YaHei", 微软雅黑, "PingFang SC", system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Code", Consolas, "SFMono-Regular", monospace;

  --nav-h: 3.4rem;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --dur-fast: 180ms;
}

:root[data-theme='dark'] {
  --paper: #141413;
  --canvas: #1a1917;
  --ink:   #faf9f5;
  --muted: #a5a29a;
  --faint: #6e6961;
  --rule:  #2e2c28;
  --accent: #d97757;
  --accent-light: #fccdbc;
  --pine:  #93a878;
  --code-bg: #232220;
  --code-block: #1c1b1a;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

body.st-body {
  margin: 0;
  height: 100vh;
  display: grid;
  grid-template-rows: var(--nav-h) minmax(0, 1fr);
  background-color: var(--paper);
  background-image:
    linear-gradient(to right, color-mix(in srgb, var(--rule) 40%, transparent) 1px, transparent 1px),
    linear-gradient(to bottom, color-mix(in srgb, var(--rule) 40%, transparent) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 0.9375rem;
  line-height: 1.55;
  overflow: hidden;
}

/* ==========================================================================
   顶部极简整合栏（无冗余侧边导航，功能全部收敛至按钮）
   ========================================================================== */
.st-topbar {
  height: var(--nav-h);
  padding: 0 1.25rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  background: color-mix(in srgb, var(--paper) 90%, var(--canvas));
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--rule);
  z-index: 30;
}

.st-topbar-left,
.st-topbar-right {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-width: 0;
}

.st-brand {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  padding-right: 0.75rem;
  border-right: 1px solid var(--rule);
}

.st-brand-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}

.st-brand-title {
  margin: 0;
  font-family: var(--kai);
  font-size: 1.35rem; /* >= 20px 楷体护栏 */
  font-weight: 400;
  letter-spacing: 0.08em;
  color: var(--ink);
  line-height: 1;
}

.st-brand-sub {
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.06em;
  color: var(--muted);
  padding: 0.12rem 0.42rem;
  border: 1px solid var(--rule);
  border-radius: 2px;
  background: var(--paper);
}

/* 按钮通用体系 */
.st-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.32rem;
  padding: 0.34rem 0.72rem;
  font-family: var(--sans);
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 3px;
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--dur-fast) ease;
}
.st-btn:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent);
}
.st-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.st-btn[aria-pressed='true'],
.st-btn.is-active {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 13%, var(--paper));
  color: var(--accent);
  font-weight: 600;
}
.st-btn--primary {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
}
.st-btn--primary:hover:not(:disabled) {
  background: color-mix(in srgb, var(--accent) 85%, #000);
  border-color: color-mix(in srgb, var(--accent) 85%, #000);
  color: #fff;
}
.st-btn--danger {
  color: var(--muted);
}
.st-btn--danger:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 10%, var(--paper));
}

.st-btn-group {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.16rem;
  border: 1px solid var(--rule);
  background: color-mix(in srgb, var(--canvas) 75%, var(--paper));
  border-radius: 4px;
}
.st-btn-group .st-btn {
  border: 0;
  background: transparent;
  padding: 0.24rem 0.62rem;
  font-size: 0.78rem;
  border-radius: 2px;
}
.st-btn-group .st-btn[aria-pressed='true'] {
  background: var(--paper);
  color: var(--accent);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent);
}

/* ==========================================================================
   核心左右分栏布局（左侧：数据与统计整合；右侧：地球模型）
   ========================================================================== */
.st-split-workspace {
  height: 100%;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(430px, 46%) minmax(460px, 54%);
  overflow: hidden;
}

/* 左侧面板：数据与统计整合 */
.st-left-pane {
  height: 100%;
  min-height: 0;
  overflow-y: auto;
  padding: 1rem 1.15rem 1.5rem;
  border-right: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
  scrollbar-width: thin;
}

/* 指标卡片四宫格（点击直接切换日/周/月/年整合粒度） */
.st-kpi-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.55rem;
  flex-shrink: 0;
}

.st-kpi-btn {
  text-align: left;
  padding: 0.65rem 0.75rem;
  border: 1px solid var(--rule);
  background: var(--paper);
  border-radius: 3px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 0.18rem;
  transition: border-color var(--dur-fast) ease, background var(--dur-fast) ease;
}
.st-kpi-btn:hover {
  border-color: color-mix(in srgb, var(--accent) 55%, var(--rule));
}
.st-kpi-btn.is-active {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 8%, var(--paper));
  box-shadow: inset 3px 0 0 var(--accent);
}
.st-kpi-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--muted);
}
.st-kpi-label span:first-child {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 0.75rem;
  color: var(--ink);
}
.st-kpi-btn.is-active .st-kpi-label span:first-child {
  color: var(--accent);
}
.st-kpi-val {
  font-family: var(--mono);
  font-size: 1.38rem;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.15;
  margin-top: 0.1rem;
}
.st-kpi-btn.is-active .st-kpi-val {
  color: var(--accent);
}
.st-kpi-val small {
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--muted);
  margin-left: 0.2rem;
}
.st-kpi-foot {
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--muted);
  margin-top: 0.1rem;
}

/* 左侧通用数据卡片 */
.st-card {
  border: 1px solid var(--rule);
  background: var(--paper);
  border-radius: 3px;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.st-card--grow {
  flex: 1;
  min-height: 18rem;
}

.st-card-head {
  padding: 0.6rem 0.85rem;
  border-bottom: 1px solid var(--rule);
  background: color-mix(in srgb, var(--paper) 92%, var(--canvas));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.st-card-title {
  display: flex;
  align-items: baseline;
  gap: 0.45rem;
  font-family: var(--kai);
  font-size: 1.25rem; /* 20px 楷体护栏 */
  color: var(--ink);
  line-height: 1.2;
}

.st-card-badge {
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--accent);
  padding: 0.08rem 0.38rem;
  border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--rule));
  background: color-mix(in srgb, var(--accent) 8%, var(--paper));
  border-radius: 2px;
}

/* 过滤芯片条 */
.st-filter-bar {
  padding: 0.45rem 0.85rem;
  border-bottom: 1px solid var(--rule);
  background: color-mix(in srgb, var(--accent) 5%, var(--paper));
  display: flex;
  align-items: center;
  gap: 0.4rem;
  flex-wrap: wrap;
  font-size: 0.76rem;
}
.st-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.28rem;
  padding: 0.1rem 0.48rem;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--rule));
  background: var(--paper);
  border-radius: 2px;
  font-family: var(--sans);
  font-size: 0.74rem;
  color: var(--ink);
}
.st-chip button {
  border: 0;
  background: none;
  color: var(--accent);
  cursor: pointer;
  padding: 0;
  font-size: 0.85rem;
  line-height: 1;
}

/* 搜索与设备筛选工具条 */
.st-log-toolbar {
  padding: 0.55rem 0.85rem;
  border-bottom: 1px solid var(--rule);
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.st-search-input {
  flex: 1 1 11rem;
  min-width: 0;
  padding: 0.32rem 0.62rem;
  font-family: var(--sans);
  font-size: 0.8125rem;
  color: var(--ink);
  background: color-mix(in srgb, var(--paper) 95%, var(--canvas));
  border: 1px solid var(--rule);
  border-radius: 3px;
  outline: none;
}
.st-search-input:focus {
  border-color: var(--accent);
}

/* 紧凑数据表格 */
.st-table-scroll {
  width: 100%;
  overflow-x: auto;
  flex: 1;
}
.st-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8125rem;
}
.st-table th,
.st-table td {
  padding: 0.48rem 0.7rem;
  border-bottom: 1px solid var(--rule);
  text-align: left;
  vertical-align: middle;
  white-space: nowrap;
}
.st-table th {
  font-family: var(--mono);
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--muted);
  background: color-mix(in srgb, var(--paper) 92%, var(--canvas));
  letter-spacing: 0.03em;
  position: sticky;
  top: 0;
  z-index: 1;
}
.st-table tbody tr {
  transition: background var(--dur-fast) ease;
}
.st-table tbody tr:hover {
  background: color-mix(in srgb, var(--accent) 6%, var(--paper));
}
.st-table tbody tr.is-active {
  background: color-mix(in srgb, var(--accent) 13%, var(--paper));
}
.st-mono {
  font-family: var(--mono);
  font-size: 0.76rem;
}
.st-ip-badge {
  font-family: var(--mono);
  font-size: 0.75rem;
  padding: 0.08rem 0.36rem;
  background: var(--code-bg);
  border: 1px solid var(--rule);
  border-radius: 2px;
  color: var(--ink);
}
.st-country-pill {
  display: inline-block;
  padding: 0.06rem 0.38rem;
  font-size: 0.72rem;
  border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--rule));
  color: var(--accent);
  border-radius: 2px;
  font-weight: 500;
}
.st-dev-tag {
  display: inline-block;
  font-family: var(--mono);
  font-size: 0.66rem;
  padding: 0.04rem 0.32rem;
  border-radius: 2px;
  border: 1px solid var(--rule);
  color: var(--muted);
}
.st-dev-tag--desktop {
  border-color: color-mix(in srgb, var(--accent) 45%, var(--rule));
  color: var(--accent);
}
.st-dev-tag--mobile {
  border-color: color-mix(in srgb, var(--pine) 55%, var(--rule));
  color: var(--pine);
}

/* 比例小横条（内嵌在汇总表单元格中） */
.st-inline-bar {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}
.st-inline-track {
  width: 3.4rem;
  height: 4px;
  background: var(--rule);
  border-radius: 2px;
  overflow: hidden;
}
.st-inline-fill {
  height: 100%;
  background: var(--accent);
}

.st-card-foot {
  padding: 0.45rem 0.85rem;
  border-top: 1px solid var(--rule);
  background: color-mix(in srgb, var(--paper) 94%, var(--canvas));
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--muted);
}

/* ==========================================================================
   右侧面板：3D 动态粒子旋转地球模型（保留 3d.html 模型 + 按钮化控制）
   ========================================================================== */
.st-right-pane {
  position: relative;
  height: 100%;
  min-height: 0;
  background: #080a10;
  overflow: hidden;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

.st-globe-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* 地球模型四角悬浮控制按钮与状态（精简不挡视野） */
.st-globe-overlay {
  position: absolute;
  z-index: 5;
  pointer-events: none;
}

.st-globe-overlay--tl {
  top: 0.9rem;
  left: 0.9rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  max-width: 19rem;
}

.st-globe-overlay--tr {
  top: 0.9rem;
  right: 0.9rem;
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 0.38rem;
  pointer-events: auto;
}

.st-globe-overlay--bl {
  bottom: 0.9rem;
  left: 0.9rem;
  pointer-events: none;
}

.st-globe-overlay--br {
  bottom: 0.9rem;
  right: 0.9rem;
  display: flex;
  align-items: center;
  gap: 0.35rem;
  pointer-events: auto;
}

.st-globe-pill {
  padding: 0.42rem 0.68rem;
  background: rgba(14, 17, 24, 0.82);
  border: 1px solid rgba(217, 119, 87, 0.35);
  backdrop-filter: blur(8px);
  border-radius: 4px;
  color: #f8fafc;
  font-family: var(--mono);
  font-size: 0.7rem;
  line-height: 1.45;
}

.st-globe-ctrl-btn {
  pointer-events: auto;
  padding: 0.32rem 0.62rem;
  background: rgba(14, 17, 24, 0.84);
  border: 1px solid rgba(255, 255, 255, 0.16);
  backdrop-filter: blur(8px);
  border-radius: 4px;
  color: #e2e8f0;
  font-family: var(--sans);
  font-size: 0.76rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  transition: all var(--dur-fast) ease;
}
.st-globe-ctrl-btn:hover {
  border-color: var(--accent);
  color: #ffffff;
  background: rgba(217, 119, 87, 0.22);
}
.st-globe-ctrl-btn[aria-pressed='true'] {
  border-color: var(--accent);
  background: rgba(217, 119, 87, 0.28);
  color: #ffffff;
}

.st-legend-inline {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  margin-top: 0.2rem;
  font-family: var(--sans);
  font-size: 0.68rem;
  color: #cbd5e1;
}
.st-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 0.28rem;
}
.st-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  display: inline-block;
}

/* 确认弹窗与源码弹窗 */
.st-dialog-backdrop {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(14, 14, 13, 0.6);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.25rem;
}
.st-dialog {
  width: min(100%, 26rem);
  background: var(--paper);
  border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--rule));
  border-radius: 4px;
  box-shadow: 0 24px 56px -12px rgba(0, 0, 0, 0.45);
  overflow: hidden;
}
.st-dialog-header {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  padding: 0.85rem 1.15rem;
  border-bottom: 1px solid var(--rule);
  background: color-mix(in srgb, var(--paper) 90%, var(--canvas));
}
.st-dialog-title {
  font-family: var(--kai);
  font-size: 1.25rem;
  color: var(--ink);
}
.st-dialog-body {
  padding: 1rem 1.15rem;
  font-size: 0.88rem;
  color: var(--muted);
  line-height: 1.65;
}
.st-dialog-footer {
  display: flex;
  justify-content: flex-end;
  gap: 0.5rem;
  padding: 0.75rem 1.15rem;
  border-top: 1px solid var(--rule);
}

.st-toast {
  position: fixed;
  left: 50%;
  bottom: 1.4rem;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--paper);
  border: 1px solid var(--accent);
  padding: 0.45rem 1rem;
  border-radius: 3px;
  font-size: 0.78rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 180ms ease;
  z-index: 250;
}
.st-toast.st-show { opacity: 1; }
.st-toast--err { background: var(--accent); color: #fff; }

/* 响应式：窄屏自动上下分栏 */
@media (max-width: 1024px) {
  body.st-body {
    height: auto;
    min-height: 100vh;
    overflow-y: auto;
  }
  .st-topbar {
    height: auto;
    padding: 0.6rem 0.9rem;
    flex-wrap: wrap;
  }
  .st-split-workspace {
    grid-template-columns: minmax(0, 1fr);
    height: auto;
  }
  .st-left-pane {
    border-right: 0;
    border-bottom: 1px solid var(--rule);
    overflow: visible;
  }
  .st-right-pane {
    height: 520px;
  }
}

@media (max-width: 600px) {
  .st-kpi-strip {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
  
html.st-embed a[href="/studio/"] { display: none !important; }
</style>
</head>
<body class="st-body">
  <!-- 顶部极简导航与功能按钮栏 -->
  <header class="st-topbar" id="st-bar"></header>

  <!-- 左右分栏主工作区：左侧数据与统计整合，右侧 3D 粒子地球模型 -->
  <main class="st-split-workspace" id="st-main">
    <!-- 左侧：访客数据、周/月/年统计整合、每日访客 IP 与设备明细 -->
    <section class="st-left-pane" id="st-left-pane" aria-label="访客数据与统计整合"></section>

  <script>
    if (new URLSearchParams(location.search).get('embed') === '1') {
      document.documentElement.classList.add('st-embed');
    }
    (function () {
      // =========================================================================
      // 1. 基础 DOM 工具与主题切换
      // =========================================================================
      const $ = (sel, root = document) => root.querySelector(sel);
      const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
      const esc = (s) =>
        String(s ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');

      let toastTimer;
      function toast(msg, isError = false) {
        const box = $('#st-toast');
        if (!box) return;
        box.textContent = msg;
        box.classList.toggle('st-toast--err', isError);
        box.classList.add('st-show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => box.classList.remove('st-show'), isError ? 4500 : 2800);
      }

      function copyText(text, successMsg) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            () => toast(successMsg),
            () => fallbackCopy(text, successMsg)
          );
        } else {
          fallbackCopy(text, successMsg);
        }
      }

      function fallbackCopy(text, successMsg) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          toast(successMsg);
        } catch (e) {
          toast(successMsg);
        }
        ta.remove();
      }

      function showConfirm(opts) {
        return new Promise((resolve) => {
          const backdrop = document.createElement('div');
          backdrop.className = 'st-dialog-backdrop';
          backdrop.innerHTML = `
            <div class="st-dialog" role="alertdialog" aria-modal="true">
              <div class="st-dialog-header">
                <div class="st-dialog-title">${esc(opts.title || '确认操作')}</div>
              </div>
              <div class="st-dialog-body">${esc(opts.body || '')}</div>
              <div class="st-dialog-footer">
                <button type="button" class="st-btn" id="st-dlg-cancel">${esc(opts.cancel || '取消')}</button>
                <button type="button" class="st-btn st-btn--primary" id="st-dlg-confirm">${esc(opts.confirm || '确认')}</button>
              </div>
            </div>`;
          const close = (res) => {
            backdrop.remove();
            resolve(res);
          };
          backdrop.querySelector('#st-dlg-cancel').addEventListener('click', () => close(false));
          backdrop.querySelector('#st-dlg-confirm').addEventListener('click', () => close(true));
          backdrop.addEventListener('click', (e) => {
            if (e.target === backdrop) close(false);
          });
          document.body.appendChild(backdrop);
        });
      }

      function applyTheme(theme) {
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        try {
          localStorage.setItem('theme', theme);
        } catch (e) {}
      }

      // Studio 顶栏统一控制主题；统计页不再保留自己的切换按钮。
      window.addEventListener('message', (event) => {
        if (event.origin !== window.location.origin) return;
        if (!event.data || event.data.type !== 'yesheng:studio-theme') return;
        applyTheme(event.data.theme === 'dark' ? 'dark' : 'light');

      const gridCountry = new Uint8Array(MAP_W * MAP_H);
      const gridCoast = new Uint8Array(MAP_W * MAP_H);
      const gridBorder = new Uint8Array(MAP_W * MAP_H);
      const gridBorderPeer = new Uint8Array(MAP_W * MAP_H);
      const countryById = new Map();
      const countryByZh = new Map();

      function decodeCountryGrid() {
        const toneBuckets = [0.84, 0.92, 1.00, 1.07, 0.88, 0.96, 1.04];
        COUNTRIES_META.forEach((c) => {
          c.tone = toneBuckets[(c.id * 11) % toneBuckets.length];
          countryById.set(c.id, c);
          countryByZh.set(c.zh, c);
        });

        const raw = atob(COUNTRY_RLE_B64);
        let ptr = 0;
        for (let i = 0; i < raw.length; i += 2) {
          const val = raw.charCodeAt(i);
          const len = raw.charCodeAt(i + 1);
          for (let k = 0; k < len && ptr < MAP_W * MAP_H; k++) {
            gridCountry[ptr++] = val;
          }
        }

        // 识别海岸线像素 (gridCoast) 与国际国界线像素 (gridBorder)
        // 关键修复：两个相邻国家的共享国界线只在单侧（cid < 邻国 id）生成一次白线像素，彻底消除双白线重复！
        for (let r = 1; r < MAP_H - 1; r++) {
          const rowOff = r * MAP_W;
          for (let c = 0; c < MAP_W; c++) {
            const idx = rowOff + c;
            const cid = gridCountry[idx];
            if (cid === 0) continue;
            const left = rowOff + ((c - 1 + MAP_W) % MAP_W);
            const right = rowOff + ((c + 1) % MAP_W);
            const up = (r - 1) * MAP_W + c;
            const down = (r + 1) * MAP_W + c;
            const n1 = gridCountry[left];
            const n2 = gridCountry[right];
            const n3 = gridCountry[up];
            const n4 = gridCountry[down];
            if (n1 === 0 || n2 === 0 || n3 === 0 || n4 === 0) {
              gridCoast[idx] = 1;
            } else {
              const peer =
                (n1 > cid ? n1 : 0) ||
                (n2 > cid ? n2 : 0) ||
                (n3 > cid ? n3 : 0) ||
                (n4 > cid ? n4 : 0);
              if (peer > 0) {
                gridBorder[idx] = 1;
                gridBorderPeer[idx] = peer;
              }
            }
          }
        }

        // 对阶梯状斜向国界线做 1 像素单线化细化（剔除 2×2 直角冗余拐点，确保任意国界处白线只显示单层）
        for (let r = 1; r < MAP_H - 1; r++) {
          const rowOff = r * MAP_W;
          for (let c = 0; c < MAP_W; c++) {
            const idx = rowOff + c;
            if (!gridBorder[idx]) continue;
            const cLeft = (c - 1 + MAP_W) % MAP_W;
            const cRight = (c + 1) % MAP_W;
            const right = rowOff + cRight;
            const left = rowOff + cLeft;
            const up = (r - 1) * MAP_W + c;
            const down = (r + 1) * MAP_W + c;
            if (gridBorder[right] && gridBorder[down] && !gridBorder[(r + 1) * MAP_W + cRight]) {
              gridBorder[idx] = 0;
            } else if (gridBorder[left] && gridBorder[down] && !gridBorder[(r + 1) * MAP_W + cLeft]) {
              gridBorder[idx] = 0;
            } else if (gridBorder[right] && gridBorder[up] && !gridBorder[(r - 1) * MAP_W + cRight]) {
              gridBorder[idx] = 0;
            } else if (gridBorder[left] && gridBorder[up] && !gridBorder[(r - 1) * MAP_W + cLeft]) {
              gridBorder[idx] = 0;
            }
          }
        }
      }

      function degToRad(d) { return (d * Math.PI) / 180.0; }
      function radToDeg(r) { return (r * 180.0) / Math.PI; }

      // 粒子结构: type: 0 = 海洋, 1 = 陆地内部, 2 = 海岸线描边, 3 = 国家边界描边
      let particles = [];
      function buildGlobeParticles(fibCount) {
        particles = [];
        const goldenAngle = Math.PI * (3.0 - Math.sqrt(5.0));

        // (A) 斐波那契球面均匀晶格粒子（仅负责海洋与陆地内部填充，不再重复叠加国界/海岸白线粒子）
        for (let i = 0; i < fibCount; i++) {
          const wy = 1.0 - (2.0 * (i + 0.5)) / fibCount;
          const radius = Math.sqrt(Math.max(0, 1.0 - wy * wy));
          const theta = goldenAngle * i;
          const wx = radius * Math.sin(theta);
          const wz = radius * Math.cos(theta);
          const lat = radToDeg(Math.asin(Math.max(-1, Math.min(1, wy))));
          const lon = radToDeg(Math.atan2(wx, wz));
          let c = Math.floor(((lon + 180.0) / 360.0) * MAP_W) % MAP_W;
          if (c < 0) c += MAP_W;
          let r = Math.floor(((90.0 - lat) / 180.0) * MAP_H);
          r = Math.max(0, Math.min(MAP_H - 1, r));
          const idx = r * MAP_W + c;
          const cid = gridCountry[idx];
          if (cid > 0 && (gridBorder[idx] === 1 || gridCoast[idx] === 1)) {
            // 边界与海岸位置交由下方 (B) 独立单次描边层精确生成，避免晶格点与描边层产生双白线重影
            continue;
          }
          let type = 0;
          let tone = 1.0;
          if (cid > 0) {
            type = 1;
            const cMeta = countryById.get(cid);
            if (cMeta) tone = cMeta.tone;
          }
          particles.push({
            wx, wy, wz, lat, lon, cid, borderCid: 0, type, tone,
            phase: (i * 0.6180339) % (Math.PI * 2)
          });
        }

        // (B) 独立高精度海岸线与单次去重国界描边轮廓粒子（每个边界位置严格只显示一次）
        const seenOutlinePos = new Set();
        for (let r = 2; r < MAP_H - 2; r += 1) {
          const lat = 90.0 - (r + 0.5) * (180.0 / MAP_H);
          const latR = degToRad(lat);
          const wy = Math.sin(latR);
          const rCos = Math.cos(latR);
          const stepC = Math.max(1, Math.round(1.3 / Math.max(0.18, rCos)));
          const rowOff = r * MAP_W;
          for (let c = 0; c < MAP_W; c += 1) {
            const idx = rowOff + c;
            const isCoast = gridCoast[idx] === 1;
            const isBorder = gridBorder[idx] === 1;
            if (!isCoast && !isBorder) continue;
            if (isCoast && !isBorder) {
              if (stepC > 1 && c % stepC !== 0) continue;
              if ((r + c) % 2 !== 0) continue;
            } else if (isBorder && stepC > 1) {
              // 高纬度横向连续边界适度抽稀，纵向边界保持完整不断线
              const prevC = (c - 1 + MAP_W) % MAP_W;
              if (gridBorder[rowOff + prevC] === 1 && c % stepC !== 0) continue;
            }
            const posKey = `${r}:${c}`;
            if (seenOutlinePos.has(posKey)) continue;
            seenOutlinePos.add(posKey);

            const cid = gridCountry[idx];
            const peerCid = isBorder ? gridBorderPeer[idx] : 0;
            const lon = -180.0 + (c + 0.5) * (360.0 / MAP_W);
            const lonR = degToRad(lon);
            const wx = rCos * Math.sin(lonR);
            const wz = rCos * Math.cos(lonR);
            const cMeta = countryById.get(cid);
            particles.push({
              wx, wy, wz, lat, lon, cid,
              borderCid: peerCid,
              type: isBorder ? 3 : 2,
              tone: cMeta ? cMeta.tone : 1.0,
              phase: ((r * 31 + c) % 100) * 0.0628
            });
          }
        }

        const hudP = $('#st-hud-particles');
        if (hudP) hudP.textContent = particles.length.toLocaleString();
      }

      function viewToEarthLatLon(vx, vy, vz, centerLonDeg, centerLatDeg, tiltDeg) {
        let x = vx, y = vy, z = vz;
        if (tiltDeg !== 0) {
          const tr = degToRad(tiltDeg);
          const ct = Math.cos(tr), st = Math.sin(tr);
          const nx = x * ct - y * st;
          const ny = x * st + y * ct;
          x = nx; y = ny;
        }
        const phi = degToRad(centerLatDeg);
        const cp = Math.cos(phi), sp = Math.sin(phi);
        const y1 = y * cp + z * sp;
        const z1 = -y * sp + z * cp;
        const x1 = x;
        const lam = degToRad(centerLonDeg);
        const cl = Math.cos(lam), sl = Math.sin(lam);
        const wx = x1 * cl + z1 * sl;
        const wz = -x1 * sl + z1 * cl;
        const wy = y1;
        const lat = radToDeg(Math.asin(Math.max(-1, Math.min(1, wy))));
        const lon = radToDeg(Math.atan2(wx, wz));
        return { lat, lon };
      }

      function lookupCountryAtLatLon(lat, lon) {
        let c = Math.floor(((lon + 180.0) / 360.0) * MAP_W) % MAP_W;
        if (c < 0) c += MAP_W;
        let r = Math.floor(((90.0 - lat) / 180.0) * MAP_H);
        r = Math.max(0, Math.min(MAP_H - 1, r));
        const directCid = gridCountry[r * MAP_W + c];
        if (directCid > 0) return directCid;
        for (let dr = -2; dr <= 2; dr++) {
          const nr = r + dr;
          if (nr < 0 || nr >= MAP_H) continue;
          for (let dc = -2; dc <= 2; dc++) {
            const nc = (c + dc + MAP_W) % MAP_W;
            const nCid = gridCountry[nr * MAP_W + nc];
            if (nCid > 0) return nCid;
          }
        }
        return 0;
      }

      /**
       * 若沿海/海岛城市的经纬度在 0.5° 栅格中恰好落在海岸线外侧 1~2 格的海水像素上，
       * 自动向所属国家的最近陆地像素微调吸附，确保地球模型上的信标严格落在陆地轮廓内且贴合真实地理位置。
       */
      function snapToCountryLand(lat, lon, targetCid) {
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return { lat: 35.0, lon: 104.0 };
        let c = Math.floor(((lon + 180.0) / 360.0) * MAP_W) % MAP_W;
        if (c < 0) c += MAP_W;
        let r = Math.floor(((90.0 - lat) / 180.0) * MAP_H);
        r = Math.max(0, Math.min(MAP_H - 1, r));
        const curCid = gridCountry[r * MAP_W + c];
        if (curCid > 0 && (!targetCid || curCid === targetCid)) {
          return { lat, lon };
        }
        let bestDistSq = 999;
        let bestLat = lat;
        let bestLon = lon;
        for (let dr = -3; dr <= 3; dr++) {
          const nr = r + dr;
          if (nr < 1 || nr >= MAP_H - 1) continue;
          for (let dc = -3; dc <= 3; dc++) {
            const nc = (c + dc + MAP_W) % MAP_W;
            const nCid = gridCountry[nr * MAP_W + nc];
            if (nCid === 0) continue;
            if (targetCid && nCid !== targetCid) continue;
            const d2 = dr * dr + dc * dc;
            if (d2 < bestDistSq) {
              bestDistSq = d2;
              bestLat = Number((90.0 - (nr + 0.5) * (180.0 / MAP_H)).toFixed(2));
              bestLon = Number((-180.0 + (nc + 0.5) * (360.0 / MAP_W)).toFixed(2));
            }
          }
        }
        return { lat: bestLat, lon: bestLon };
      }

      function resolveVisitorCoords(r) {
        const meta = countryByZh.get(r.countryZh);
        const targetCid = meta ? meta.id : 0;
        const text = `${r.region || ''} ${r.countryZh || ''}`;
        if (r.countryCode === 'CN' || r.countryZh === '中国') {
          for (let i = 0; i < CN_CITY_COORDS.length; i++) {
            const item = CN_CITY_COORDS[i];
            if (text.includes(item.match)) {
              return snapToCountryLand(item.lat, item.lon, targetCid);
            }
          }
        }
        const rawLat = Number(r.lat);
        const rawLon = Number(r.lon);
        const isGenericChinaCenter =
          Math.abs(rawLat - 35.0) < 0.08 && Math.abs(rawLon - 104.0) < 0.08;
        if (Number.isFinite(rawLat) && Number.isFinite(rawLon)) {
          if (!isGenericChinaCenter || r.countryZh === '中国' || r.countryCode === 'CN') {
            return snapToCountryLand(rawLat, rawLon, targetCid);
          }
        }
        if (meta) {
          return snapToCountryLand(meta.lat, meta.lon, targetCid);
        }
        return { lat: Number.isFinite(rawLat) ? rawLat : 35.0, lon: Number.isFinite(rawLon) ? rawLon : 104.0 };
      }

      // =========================================================================
      // 3. 访客记录数据引擎（支持每日访客数、IP、设备及按日/周/月/年整合）
      // =========================================================================
      let visitorLogs = [];
      let nextLogId = 1;
      let currentClientIp = '';

      function formatYmd(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function getMondayYmd(ymdStr) {
        const parts = ymdStr.split('-').map(Number);
        const d = new Date(parts[0], parts[1] - 1, parts[2]);
        const day = d.getDay();
        const diff = (day + 6) % 7;
        d.setDate(d.getDate() - diff);
        return formatYmd(d);
      }

      function getBucketKey(ymdStr, granularity) {
        if (granularity === 'week') return getMondayYmd(ymdStr);
        if (granularity === 'month') return ymdStr.slice(0, 7);
        if (granularity === 'year') return ymdStr.slice(0, 4);
        return ymdStr;
      }

      function formatBucketLabel(granularity, bucket) {
        if (granularity === 'day') return bucket;
        if (granularity === 'week') return `${bucket} 周`;
        if (granularity === 'month') return `${bucket} 月`;
        return `${bucket} 年`;
      }

      function computeDashboard(opts) {
        const granularity = opts.granularity || 'day';
        const selBucket = opts.bucket || null;
        const selCountry = opts.country || null;
        const selDevice = opts.device || null;
        const q = (opts.q || '').trim().toLowerCase();
        const page = Math.max(1, opts.page || 1);
        const pageSize = opts.pageSize || 10;

        const today = formatYmd(new Date());
        const weekStart = getMondayYmd(today);
        const thisMonth = today.slice(0, 7);
        const thisYear = today.slice(0, 4);

        const calcUvPv = (pred) => {
          const ips = new Set();
          let pv = 0;
          for (const r of visitorLogs) {
            if (pred(r)) {
              ips.add(r.ip);
              pv += r.pvCount;
            }
          }
          return { uv: ips.size, pv };
        };

        const todayStat = calcUvPv((r) => r.visitDate === today);
        const weekStat = calcUvPv((r) => r.visitDate >= weekStart);
        const monthStat = calcUvPv((r) => r.visitDate.startsWith(thisMonth));
        const yearStat = calcUvPv((r) => r.visitDate.startsWith(thisYear));
        const totalStat = calcUvPv(() => true);
        const allCountriesSet = new Set(visitorLogs.map((r) => r.countryZh));

        const bucketMap = new Map();
        for (const r of visitorLogs) {
          if (selCountry && r.countryZh !== selCountry) continue;
          if (selDevice && r.deviceType !== selDevice) continue;
          const bKey = getBucketKey(r.visitDate, granularity);
          let b = bucketMap.get(bKey);
          if (!b) {
            b = {
              bucket: bKey,
              label: formatBucketLabel(granularity, bKey),
              ips: new Set(),
              pv: 0,
              desktop: 0,
              mobile: 0,
              tablet: 0,
              topCountry: r.countryZh
            };
            bucketMap.set(bKey, b);
          }
          b.ips.add(r.ip);
          b.pv += r.pvCount;
          if (r.deviceType === 'Desktop') b.desktop++;
          else if (r.deviceType === 'Mobile') b.mobile++;
          else b.tablet++;
        }

        const limitBuckets = granularity === 'day' ? 14 : granularity === 'week' ? 10 : granularity === 'month' ? 12 : 5;
        const series = Array.from(bucketMap.values())
          .sort((a, b) => b.bucket.localeCompare(a.bucket))
          .slice(0, limitBuckets)
          .map((b) => ({
            bucket: b.bucket,
            label: b.label,
            uv: b.ips.size,
            pv: b.pv,
            desktop: b.desktop,
            mobile: b.mobile,
            tablet: b.tablet,
            topCountry: b.topCountry
          }));

        const countryMap = new Map();
        const beaconMap = new Map();
        for (const r of visitorLogs) {
          if (selBucket && getBucketKey(r.visitDate, granularity) !== selBucket) continue;
          const resolved = resolveVisitorCoords(r);
          r.lat = resolved.lat;
          r.lon = resolved.lon;

          let c = countryMap.get(r.countryZh);
          if (!c) {
            c = {
              countryZh: r.countryZh,
              countryEn: r.countryEn,
              countryCode: r.countryCode,
              lat: resolved.lat,
              lon: resolved.lon,
              ips: new Set(),
              pv: 0,
              latestIp: r.ip,
              latestRegion: r.region || r.countryZh,
              latestDevice: `${r.deviceType} · ${r.os} / ${r.browser}`,
              lastSeen: r.lastSeen
            };
            countryMap.set(r.countryZh, c);
          }
          c.ips.add(r.ip);
          c.pv += r.pvCount;
          if (r.lastSeen >= c.lastSeen) {
            c.lastSeen = r.lastSeen;
            c.latestIp = r.ip;
            c.latestRegion = r.region || r.countryZh;
            c.latestDevice = `${r.deviceType} · ${r.os} / ${r.browser}`;
            c.lat = resolved.lat;
            c.lon = resolved.lon;
          }

          const bKey = `${r.countryZh}|${resolved.lat.toFixed(1)},${resolved.lon.toFixed(1)}`;
          let b = beaconMap.get(bKey);
          if (!b) {
            b = {
              countryZh: r.countryZh,
              countryEn: r.countryEn,
              region: r.region || r.countryZh,
              lat: resolved.lat,
              lon: resolved.lon,
              ips: new Set(),
              pv: 0,
              latestIp: r.ip,
              lastSeen: r.lastSeen
            };
            beaconMap.set(bKey, b);
          }
          b.ips.add(r.ip);
          b.pv += r.pvCount;
          if (r.lastSeen >= b.lastSeen) {
            b.lastSeen = r.lastSeen;
            b.latestIp = r.ip;
            b.region = r.region || r.countryZh;
          }
        }
        const rawCountries = Array.from(countryMap.values()).sort((a, b) => b.ips.size - a.ips.size || b.pv - a.pv);
        const sumCountryPv = Math.max(1, rawCountries.reduce((acc, c) => acc + c.pv, 0));
        const countries = rawCountries.map((c) => ({
          countryZh: c.countryZh,
          countryEn: c.countryEn,
          countryCode: c.countryCode,
          lat: c.lat,
          lon: c.lon,
          uv: c.ips.size,
          pv: c.pv,
          share: Number(((c.pv / sumCountryPv) * 100).toFixed(1)),
          latestIp: c.latestIp,
          latestRegion: c.latestRegion,
          latestDevice: c.latestDevice,
          lastSeen: c.lastSeen
        }));
        const beacons = Array.from(beaconMap.values()).map((b) => ({
          countryZh: b.countryZh,
          countryEn: b.countryEn,
          region: b.region,
          lat: b.lat,
          lon: b.lon,
          uv: b.ips.size,
          pv: b.pv,
          latestIp: b.latestIp,
          lastSeen: b.lastSeen
        }));

        const filteredRows = visitorLogs
          .filter((r) => {
            if (selBucket && getBucketKey(r.visitDate, granularity) !== selBucket) return false;
            if (selCountry && r.countryZh !== selCountry) return false;
            if (selDevice && r.deviceType !== selDevice) return false;
            if (q) {
              const hay = `${r.ip} ${r.countryZh} ${r.region} ${r.os} ${r.browser} ${r.path}`.toLowerCase();
              if (!hay.includes(q)) return false;
            }
            return true;
          })
          .sort((a, b) => b.visitDate.localeCompare(a.visitDate) || b.lastSeen.localeCompare(a.lastSeen) || b.id - a.id);

        // 同一 IP 在当前筛选窗口内合并为一条记录；访问次数为窗口内各天访问次数之和。
        const groupedLogs = new Map();
        for (const r of filteredRows) {
          const prev = groupedLogs.get(r.ip);
          if (!prev) {
            groupedLogs.set(r.ip, {
              ...r,
              pvCount: Number(r.pvCount) || 0,
              visitCount: Number(r.visitCount) || 1,
            });
            continue;
          }
          prev.pvCount += Number(r.pvCount) || 0;
          prev.visitCount += Number(r.visitCount) || 1;
          if (r.firstSeen < prev.firstSeen) prev.firstSeen = r.firstSeen;
          if (r.lastSeen >= prev.lastSeen) {
            prev.id = r.id;
            prev.visitDate = r.visitDate;
            prev.lastSeen = r.lastSeen;
            prev.countryCode = r.countryCode;
            prev.countryZh = r.countryZh;
            prev.countryEn = r.countryEn;
            prev.region = r.region;
            prev.lat = r.lat;
            prev.lon = r.lon;
            prev.deviceType = r.deviceType;
            prev.os = r.os;
            prev.browser = r.browser;
            prev.userAgent = r.userAgent;
            prev.path = r.path;
            prev.referrer = r.referrer;
          }
        }
        const filteredLogs = Array.from(groupedLogs.values()).sort(
          (a, b) => b.visitDate.localeCompare(a.visitDate) || b.lastSeen.localeCompare(a.lastSeen) || b.id - a.id
        );

        const startIdx = (page - 1) * pageSize;
        const pageItems = filteredLogs.slice(startIdx, startIdx + pageSize);

        return {
          granularity,
          selectedBucket: selBucket,
          selectedCountry: selCountry,
          selectedDevice: selDevice,
          summary: {
            todayUv: todayStat.uv,
            todayPv: todayStat.pv,
            weekUv: weekStat.uv,
            weekPv: weekStat.pv,
            monthUv: monthStat.uv,
            monthPv: monthStat.pv,
            yearUv: yearStat.uv,
            yearPv: yearStat.pv,
            totalUv: totalStat.uv,
            totalPv: totalStat.pv,
            activeCountries: allCountriesSet.size
          },
          series,
          countries,
          beacons,
          logs: {
            items: pageItems,
            total: filteredLogs.length,
            page,
            pageSize
          }
        };
      }

      // =========================================================================
      // 4. 状态管理（精简直观）
      // =========================================================================
      const state = {
        granularity: 'day',
        selectedBucket: null,
        selectedCountryZh: null,
        selectedDeviceType: null,
        logSearchQuery: '',
        page: 1,
        pageSize: 10
      };

      const globeState = {
        fibCount: 22000,
        particleRadius: 1.35,
        rotLon: 105.0,
        rotLat: 22.0,
        targetLon: null,
        targetLat: null,
        targetZoom: null,
        zoom: 1.02,
        autoRotate: true,
        rotSpeed: 0.78,
        // 独立描边粒子颜色模式：'white' (纯白色描边) | 'light' (稍浅一点的主题色描边)
        outlineStyle: 'white',
        // 海洋粒子模式：'white' (纯白微光) | 'pale' (淡主题色)
        oceanStyle: 'white',
        showBackHemisphere: true,
        axialTilt: true,
        limbShading: true,
        breathingGlow: true,
        pulseTarget: true,
        showVisitorBeacons: true,
        clickedCountry: null,
        hoveredCountry: null,
        isDragging: false,
        pointerDownX: 0,
        pointerDownY: 0,
        dragMovedDist: 0,
        dragStartLon: 0,
        dragStartLat: 0,
        mouseX: -1,
        mouseY: -1,
        time: 0,
        lastFrameTime: performance.now(),
        fps: 60,
        rafId: 0
      };

      const BG_STARS = Array.from({ length: 110 }, (_, i) => ({
        x: ((i * 73 + 19) % 100) / 100,
        y: ((i * 41 + 37) % 100) / 100,
        r: 0.55 + ((i * 17) % 10) * 0.1,
        phase: (i * 0.85) % (Math.PI * 2)
      }));

      let dashboard = null;

      function refreshDashboard() {
        dashboard = computeDashboard({
          granularity: state.granularity,
          bucket: state.selectedBucket,
          country: state.selectedCountryZh,
          device: state.selectedDeviceType,
          q: state.logSearchQuery,
          page: state.page,
          pageSize: state.pageSize
        });
        renderTopBar();
        renderLeftPane();
      }

      // =========================================================================
      // 5. 顶栏与左侧「数据与统计整合」面板渲染（无模拟/样本按钮，仅真实访客数据）
      // =========================================================================
      function renderTopBar() {
        const bar = $('#st-bar');
        if (!bar || !dashboard) return;
        const d = dashboard;
        const ipNote = currentClientIp ? ` · 当前终端 IP: ${esc(currentClientIp)}` : '';

        bar.innerHTML = `
          <div class="st-topbar-left">
            <div class="st-brand">
              <span class="st-brand-dot"></span>
              <h1 class="st-brand-title">统计</h1>
              <span class="st-brand-sub">累计 ${d.summary.totalUv} UV / ${d.summary.totalPv} PV · ${d.summary.activeCountries} 国${ipNote}</span>
            </div>

            <div class="st-btn-group" role="tablist" aria-label="统计整合周期">
              <button type="button" class="st-btn" data-top-gran="day" aria-pressed="${state.granularity === 'day'}">按日</button>
              <button type="button" class="st-btn" data-top-gran="week" aria-pressed="${state.granularity === 'week'}">按周</button>
              <button type="button" class="st-btn" data-top-gran="month" aria-pressed="${state.granularity === 'month'}">按月</button>
              <button type="button" class="st-btn" data-top-gran="year" aria-pressed="${state.granularity === 'year'}">按年</button>
            </div>
          </div>

          <div class="st-topbar-right">
            <button type="button" class="st-btn st-btn--primary" id="st-btn-refresh" title="同步最新真实访客记录">↻ 刷新数据</button>
            <button type="button" class="st-btn" id="st-btn-export">导出 CSV</button>
            <button type="button" class="st-btn st-btn--danger" id="st-btn-clear" title="清空全部访客记录">清空</button>
            <a class="st-btn" href="/studio/" title="返回后台工作台">← 返回后台</a>
          </div>
        `;

        $$('[data-top-gran]', bar).forEach((btn) => {
          btn.addEventListener('click', () => {
            state.granularity = btn.dataset.topGran;
            state.selectedBucket = null;
            state.page = 1;
            refreshDashboard();
          });
        });

        $('#st-btn-refresh', bar)?.addEventListener('click', async () => {
          try {
            await loadServerLogs();
            refreshDashboard();
            toast('已同步最新真实访客数据');
          } catch (err) {
            toast('刷新失败：' + (err?.message || err), true);
          }

      function selectCountryOnGlobe(cMeta, clickLat, clickLon, rotateToCountry = false, visitorInfo = null) {
        const clearBtn = $('#st-globe-clear-sel');
        if (!cMeta) {
          globeState.clickedCountry = null;
          if (clearBtn) clearBtn.hidden = true;
          renderLeftPane();
          return;
        }
        const rawLat = clickLat !== undefined && Number.isFinite(clickLat) ? clickLat : cMeta.lat;
        const rawLon = clickLon !== undefined && Number.isFinite(clickLon) ? clickLon : cMeta.lon;
        const snapped = snapToCountryLand(rawLat, rawLon, cMeta.id);
        const targetLat = snapped.lat;
        const targetLon = snapped.lon;
        globeState.clickedCountry = {
          ...cMeta,
          clickLat: targetLat,
          clickLon: targetLon,
          visitorRegion: visitorInfo?.region || '',
          visitorIp: visitorInfo?.ip || '',
          clickedAt: globeState.time
        };
        if (clearBtn) clearBtn.hidden = false;
        if (rotateToCountry) {
          globeState.autoRotate = false;
          const playBtn = $('#st-globe-toggle-play');
          if (playBtn) {
            playBtn.setAttribute('aria-pressed', 'false');
            playBtn.textContent = '▶ 继续自转';
          }
          globeState.targetLon = targetLon;
          globeState.targetLat = targetLat;
        }
        renderLeftPane();
      }

      function sanitizeCsvCell(val) {
        const s = String(val ?? '').replace(/\r?\n/g, ' ');
        return /^[\s]*[=+\-@\t\r]/.test(s) ? `'${s}` : s;
      }

      function exportCsv() {
        if (!dashboard || dashboard.logs.items.length === 0) {
          toast('当前没有可导出的访客记录', true);
          return;
        }
        const headers = ['日期', 'IP地址', '国家', '地区', '设备类型', '操作系统', '浏览器', '受访路径', 'PV', '访问次数', '最后活跃时间'];
        const rows = dashboard.logs.items.map((r) => [
          r.visitDate, r.ip, r.countryZh, r.region, r.deviceType, r.os, r.browser, r.path, String(r.pvCount), String(r.visitCount ?? 0), r.lastSeen
        ]);
        const csvContent = '\uFEFF' + [headers, ...rows].map((row) => row.map((c) => `"${sanitizeCsvCell(c).replace(/"/g, '""')}"`).join(',')).join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `visitor-stats-${state.granularity}.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        toast('已导出访客统计 CSV 文件');
      }

      function wireGlobeControls() {

        // 2. 独立切换描边粒子颜色（纯白色 vs 稍浅一点的主题色）
        $('#st-globe-cycle-outline')?.addEventListener('click', () => {
          globeState.outlineStyle = globeState.outlineStyle === 'white' ? 'light' : 'white';
          const btn = $('#st-globe-cycle-outline');
          const dot = $('#st-legend-outline-dot');
          const txt = $('#st-legend-outline-text');
          if (globeState.outlineStyle === 'white') {

              dot.style.background = '#ffffff';
              dot.style.borderColor = 'rgba(255,255,255,0.6)';
            }

          } else {
            if (btn) btn.textContent = '描边：浅主题色';
            if (dot) {
              dot.style.background = 'rgb(252, 205, 188)';
              dot.style.borderColor = 'rgb(217, 119, 87)';
            }
            if (txt) txt.textContent = '独立浅主题色描边';
            toast('地球描边粒子已切换为：独立浅主题色 rgb(252, 205, 188)');
          }
        });

        // 3. 切换海洋粒子颜色
        $('#st-globe-cycle-ocean')?.addEventListener('click', () => {
          globeState.oceanStyle = globeState.oceanStyle === 'white' ? 'pale' : 'white';
          const btn = $('#st-globe-cycle-ocean');
          if (btn) {
            btn.textContent = globeState.oceanStyle === 'white' ? '海洋：纯白微光' : '海洋：淡主题色';
          }
        });

        // 4. 清除标注与重置视角
        $('#st-globe-clear-sel')?.addEventListener('click', () => {
          state.selectedCountryZh = null;
          selectCountryOnGlobe(null);
          refreshDashboard();
        });

        $('#st-globe-reset')?.addEventListener('click', () => {
          globeState.autoRotate = true;
          globeState.targetLon = 105.0;
          globeState.targetLat = 22.0;
          globeState.targetZoom = 1.02;
          state.selectedCountryZh = null;
          selectCountryOnGlobe(null);
          const playBtn = $('#st-globe-toggle-play');
          if (playBtn) {
            playBtn.setAttribute('aria-pressed', 'true');
            playBtn.textContent = '⏸ 暂停自转';
          }
          refreshDashboard();
        });

        // 5. 缩放按钮
        $('#st-globe-zoom-in')?.addEventListener('click', () => {
          globeState.targetZoom = null;
          globeState.zoom = Math.min(2.35, globeState.zoom + 0.18);
        });
        $('#st-globe-zoom-out')?.addEventListener('click', () => {
          globeState.targetZoom = null;
          globeState.zoom = Math.max(0.68, globeState.zoom - 0.18);
        });

        // 6. 画布拖拽旋转与点击国家识别（点击即过滤/标注该国访客）
        canvas.addEventListener('pointerdown', (e) => {
          globeState.isDragging = true;
          globeState.targetLon = null;
          globeState.targetLat = null;
          globeState.pointerDownX = e.clientX;
          globeState.pointerDownY = e.clientY;
          globeState.dragMovedDist = 0;
          globeState.dragStartLon = globeState.rotLon;
          globeState.dragStartLat = globeState.rotLat;
          canvas.setPointerCapture(e.pointerId);
        });

        canvas.addEventListener('pointermove', (e) => {
          const rect = canvas.getBoundingClientRect();
          globeState.mouseX = e.clientX - rect.left;
          globeState.mouseY = e.clientY - rect.top;
          if (!globeState.isDragging) return;
          const dx = e.clientX - globeState.pointerDownX;
          const dy = e.clientY - globeState.pointerDownY;
          globeState.dragMovedDist = Math.hypot(dx, dy);
          if (globeState.dragMovedDist > 3) {
            const sensitivity = 0.32 / globeState.zoom;
            globeState.rotLon = globeState.dragStartLon - dx * sensitivity;
            while (globeState.rotLon <= -180) globeState.rotLon += 360;
            while (globeState.rotLon > 180) globeState.rotLon -= 360;
            globeState.rotLat = Math.max(-82, Math.min(82, globeState.dragStartLat + dy * sensitivity));
          }
        });

        canvas.addEventListener('pointerup', (e) => {
          const wasClick = globeState.dragMovedDist < 6;
          globeState.isDragging = false;
          if (wasClick) {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const cw = rect.width;
            const ch = rect.height;
            const cx = cw * 0.5;
            const cy = ch * 0.5;
            const baseRadius = Math.min(cw, ch) * 0.41 * globeState.zoom;
            const vx = (mx - cx) / baseRadius;
            const vy = (cy - my) / baseRadius;
            const r2 = vx * vx + vy * vy;
            if (r2 <= 1.0) {
              const vz = Math.sqrt(1.0 - r2);
              const tiltDeg = globeState.axialTilt ? 14.0 : 0.0;
              const geo = viewToEarthLatLon(vx, vy, vz, globeState.rotLon, globeState.rotLat, tiltDeg);
              const cid = lookupCountryAtLatLon(geo.lat, geo.lon);
              if (cid > 0) {
                const cMeta = countryById.get(cid);
                if (cMeta) {
                  // 点击球面国家：动态显示国名标注，并联动左侧筛选该国访客记录
                  const hasVisitor = dashboard && dashboard.countries.some((c) => c.countryZh === cMeta.zh);
                  state.selectedCountryZh = hasVisitor ? cMeta.zh : null;
                  state.page = 1;
                  selectCountryOnGlobe(cMeta, geo.lat, geo.lon, false);
                  refreshDashboard();
                }
              } else {
                state.selectedCountryZh = null;
                selectCountryOnGlobe(null);
                refreshDashboard();
              }
            }
          }
        });

        canvas.addEventListener('pointercancel', () => { globeState.isDragging = false; });
        canvas.addEventListener('pointerleave', () => {
          globeState.mouseX = -1;
          globeState.mouseY = -1;
        });

        viewport.addEventListener('wheel', (e) => {
          e.preventDefault();
          globeState.targetZoom = null;
          const delta = e.deltaY < 0 ? 0.12 : -0.12;
          globeState.zoom = Math.max(0.68, Math.min(2.35, globeState.zoom + delta));
        }, { passive: false });
      }

      function renderGlobeFrame(now) {
        const dt = Math.min(0.1, (now - globeState.lastFrameTime) / 1000.0);
        globeState.lastFrameTime = now;
        globeState.time += dt;
        globeState.fps = Math.round(globeState.fps * 0.9 + (1.0 / Math.max(0.001, dt)) * 0.1);

        const canvas = $('#st-globe-canvas');
        const viewport = $('#st-globe-viewport');
        if (!canvas || !viewport) {
          globeState.rafId = requestAnimationFrame(renderGlobeFrame);
          return;
        }

        // 平滑相机旋转插值
        if (globeState.targetLon !== null && globeState.targetLat !== null) {
          let dLon = globeState.targetLon - globeState.rotLon;
          while (dLon > 180) dLon -= 360;
          while (dLon < -180) dLon += 360;
          const dLat = globeState.targetLat - globeState.rotLat;
          globeState.rotLon += dLon * Math.min(1, dt * 6.0);
          globeState.rotLat += dLat * Math.min(1, dt * 6.0);
          if (globeState.targetZoom !== null) {
            globeState.zoom += (globeState.targetZoom - globeState.zoom) * Math.min(1, dt * 5.5);
          }
          if (Math.abs(dLon) < 0.2 && Math.abs(dLat) < 0.2) {
            globeState.rotLon = globeState.targetLon;
            globeState.rotLat = globeState.targetLat;
            globeState.targetLon = null;
            globeState.targetLat = null;
            globeState.targetZoom = null;
          }
        } else if (globeState.autoRotate && !globeState.isDragging) {
          globeState.rotLon -= globeState.rotSpeed * dt * 14.0;
          if (globeState.rotLon <= -180) globeState.rotLon += 360;
          if (globeState.rotLon > 180) globeState.rotLon -= 360;
        }

        const coordsEl = $('#st-hud-coords');
        const zoomEl = $('#st-hud-zoom');
        const fpsEl = $('#st-hud-fps');
        if (coordsEl) {
          const lonStr = `${Math.abs(globeState.rotLon).toFixed(1)}${globeState.rotLon >= 0 ? '°E' : '°W'}`;
          const latStr = `${Math.abs(globeState.rotLat).toFixed(1)}${globeState.rotLat >= 0 ? '°N' : '°S'}`;
          coordsEl.textContent = `${lonStr}, ${latStr}`;
        }
        if (zoomEl) zoomEl.textContent = `${globeState.zoom.toFixed(2)}×`;
        if (fpsEl) fpsEl.textContent = String(globeState.fps);

        const vpRect = viewport.getBoundingClientRect();
        const cw = Math.max(320, Math.floor(vpRect.width));
        const ch = Math.max(320, Math.floor(vpRect.height));
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        if (canvas.width !== Math.round(cw * dpr) || canvas.height !== Math.round(ch * dpr)) {
          canvas.width = Math.round(cw * dpr);
          canvas.height = Math.round(ch * dpr);
          canvas.style.width = `${cw}px`;
          canvas.style.height = `${ch}px`;
        }

        const ctx = canvas.getContext('2d');
        ctx.save();
        ctx.scale(dpr, dpr);

        // 保持 3d.html 的纯净深空底色，使纯白/浅主题色描边粒子与 rgb(217,119,87) 陆地粒子形成极高对比度
        ctx.fillStyle = '#07090e';
        ctx.fillRect(0, 0, cw, ch);

        const cx = cw * 0.5;
        const cy = ch * 0.5;
        const baseRadius = Math.min(cw, ch) * 0.41 * globeState.zoom;
        const tiltDeg = globeState.axialTilt ? 14.0 : 0.0;

        const lam = degToRad(globeState.rotLon);
        const cl = Math.cos(lam), sl = Math.sin(lam);
        const phi = degToRad(globeState.rotLat);
        const cp = Math.cos(phi), sp = Math.sin(phi);
        const tr = degToRad(-tiltDeg);
        const ct = Math.cos(tr), st = Math.sin(tr);

        // 1. 球外星尘微粒
        for (let i = 0; i < BG_STARS.length; i++) {
          const s = BG_STARS[i];
          const sx = s.x * cw;
          const sy = s.y * ch;
          const distSq = (sx - cx) * (sx - cx) + (sy - cy) * (sy - cy);
          if (distSq > baseRadius * 1.05 * (baseRadius * 1.05)) {
            const alpha = 0.15 + 0.25 * Math.sin(globeState.time * 1.6 + s.phase);
            ctx.fillStyle = `rgba(241, 245, 249, ${alpha.toFixed(2)})`;
            ctx.beginPath();
            ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // 2. 大气呼吸外环与球体暗核
        if (globeState.breathingGlow) {
          const haloGrad = ctx.createRadialGradient(cx, cy, baseRadius * 0.82, cx, cy, baseRadius * 1.14);
          haloGrad.addColorStop(0, 'rgba(217, 119, 87, 0.03)');
          haloGrad.addColorStop(0.72, 'rgba(217, 119, 87, 0.12)');
          haloGrad.addColorStop(0.88, 'rgba(255, 245, 240, 0.06)');
          haloGrad.addColorStop(1, 'rgba(7, 9, 14, 0)');
          ctx.fillStyle = haloGrad;
          ctx.beginPath();
          ctx.arc(cx, cy, baseRadius * 1.14, 0, Math.PI * 2);
          ctx.fill();
        }

        const coreGrad = ctx.createRadialGradient(cx - baseRadius * 0.2, cy - baseRadius * 0.2, baseRadius * 0.1, cx, cy, baseRadius);
        coreGrad.addColorStop(0, 'rgba(15, 20, 30, 0.74)');
        coreGrad.addColorStop(1, 'rgba(9, 12, 20, 0.90)');
        ctx.fillStyle = coreGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, baseRadius, 0, Math.PI * 2);
        ctx.fill();

        // 3. 鼠标悬停国家检测
        globeState.hoveredCountry = null;
        let cursorGeo = null;
        if (globeState.mouseX >= 0 && globeState.mouseY >= 0) {
          const vx = (globeState.mouseX - cx) / baseRadius;
          const vy = (cy - globeState.mouseY) / baseRadius;
          const r2 = vx * vx + vy * vy;
          if (r2 <= 1.0) {
            const vz = Math.sqrt(1.0 - r2);
            cursorGeo = viewToEarthLatLon(vx, vy, vz, globeState.rotLon, globeState.rotLat, tiltDeg);
            const hCid = lookupCountryAtLatLon(cursorGeo.lat, cursorGeo.lon);
            if (hCid > 0) globeState.hoveredCountry = countryById.get(hCid) || null;
          }
        }

        const hoverEl = $('#st-globe-hover-readout');
        if (hoverEl) {
          if (cursorGeo) {
            const latStr = `${Math.abs(cursorGeo.lat).toFixed(1)}${cursorGeo.lat >= 0 ? '°N' : '°S'}`;
            const lonStr = `${Math.abs(cursorGeo.lon).toFixed(1)}${cursorGeo.lon >= 0 ? '°E' : '°W'}`;
            if (globeState.hoveredCountry) {
              const hStat = dashboard ? dashboard.countries.find((c) => c.countryZh === globeState.hoveredCountry.zh) : null;
              viewport.style.cursor = globeState.isDragging ? 'grabbing' : 'pointer';
              hoverEl.innerHTML = `<strong style="color:#fff;">[${esc(globeState.hoveredCountry.zh)} ${esc(globeState.hoveredCountry.en)}]</strong> ${latStr}, ${lonStr} ${hStat ? `· <span style="color:#fccdbc;font-weight:700;">${hStat.uv} UV / ${hStat.pv} PV</span>` : ''} · <span style="color:rgb(217,119,87);">● 点击显示标注</span>`;
            } else {
              viewport.style.cursor = globeState.isDragging ? 'grabbing' : 'grab';
              hoverEl.textContent = `[海洋区域] ${latStr}, ${lonStr}`;
            }
          } else {
            viewport.style.cursor = globeState.isDragging ? 'grabbing' : 'grab';
          }
        }

        // 4. 双层独立分桶渲染：
        //    - baseBuckets: 海洋粒子 (type=0) + 陆地内部主题色粒子 (type=1)
        //    - strokeBuckets: 独立出来的描边粒子层（海岸线 type=2 + 国家边界 type=3），恢复为白色或浅主题色，并在最后一层独立绘制！
        const baseBuckets = new Map();
        const strokeBuckets = new Map();

        const addPt = (targetMap, colorKey, radiusKey, px, py, r) => {
          const key = `${colorKey}|${radiusKey}`;
          let b = targetMap.get(key);
          if (!b) {
            b = { color: colorKey, r, pts: [] };
            targetMap.set(key, b);
          }
          b.pts.push(px, py);
        };

        const activeCid = globeState.clickedCountry ? globeState.clickedCountry.id : -1;
        const hoverCid = globeState.hoveredCountry ? globeState.hoveredCountry.id : -1;
        const pulseWave = 0.5 + 0.5 * Math.sin(globeState.time * 6.0);
        const basePR = globeState.particleRadius * Math.pow(globeState.zoom, 0.35);
        const useWhiteOutline = globeState.outlineStyle === 'white';

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          const x1 = p.wx * cl - p.wz * sl;
          const z1 = p.wx * sl + p.wz * cl;
          const y1 = p.wy;
          let vx = x1;
          let vy = y1 * cp - z1 * sp;
          const vz = y1 * sp + z1 * cp;

          if (vz < 0) {
            if (!globeState.showBackHemisphere) continue;
            if (p.cid === 0 || i % 3 !== 0) continue;
            if (tiltDeg !== 0) {
              const nx = vx * ct - vy * st;
              const ny = vx * st + vy * ct;
              vx = nx; vy = ny;
            }
            const backColor = (p.type === 2 || p.type === 3)
              ? (useWhiteOutline ? 'rgba(255, 255, 255, 0.14)' : 'rgba(252, 205, 188, 0.15)')
              : 'rgba(217, 119, 87, 0.11)';
            addPt(baseBuckets, backColor, 'back', cx + vx * baseRadius, cy - vy * baseRadius, basePR * 0.72);
            continue;
          }

          if (tiltDeg !== 0) {
            const nx = vx * ct - vy * st;
            const ny = vx * st + vy * ct;
            vx = nx; vy = ny;
          }

          const px = cx + vx * baseRadius;
          const py = cy - vy * baseRadius;
          const depthBucket = vz > 0.7 ? 2 : vz > 0.35 ? 1 : 0;

          if (p.cid === 0) {
            // 海洋粒子
            const oceanColor = globeState.oceanStyle === 'pale'
              ? `rgba(217, 119, 87, ${(0.15 + depthBucket * 0.10).toFixed(2)})`
              : `rgba(255, 255, 255, ${(0.18 + depthBucket * 0.11).toFixed(2)})`;
            addPt(baseBuckets, oceanColor, `oc${depthBucket}`, px, py, basePR * 0.74);
            continue;
          }

          const isClicked = p.cid === activeCid || (p.type === 3 && p.borderCid === activeCid);
          const isHovered = p.cid === hoverCid || (p.type === 3 && p.borderCid === hoverCid);

          // 选中或悬停国家的粒子高亮
          if (isClicked && globeState.pulseTarget) {
            if (p.type === 2 || p.type === 3) {
              addPt(strokeBuckets, '#ffffff', 'sel_stroke', px, py, basePR * 1.38);
            } else {
              const rVal = Math.round(242 + pulseWave * 13);
              const gVal = Math.round(162 + pulseWave * 35);
              const bVal = Math.round(132 + pulseWave * 35);
              addPt(baseBuckets, `rgb(${rVal}, ${gVal}, ${bVal})`, 'sel_land', px, py, basePR * 1.22);
            }
            continue;
          }

          if (isHovered) {
            if (p.type === 2 || p.type === 3) {
              addPt(strokeBuckets, '#ffffff', 'hov_stroke', px, py, basePR * 1.22);
            } else {
              addPt(baseBuckets, 'rgb(238, 148, 118)', 'hov_land', px, py, basePR * 1.08);
            }
            continue;
          }

          // ============ 独立描边粒子层（海岸线 p.type === 2 与 国家边界 p.type === 3） ============
          if (p.type === 2 || p.type === 3) {
            const isCoast = p.type === 2;
            const alpha = (isCoast ? (0.58 + depthBucket * 0.18) : (0.50 + depthBucket * 0.18)).toFixed(2);
            // 纯白色描边 vs 稍浅一点的主题色描边 rgb(252, 205, 188)
            const strokeColor = useWhiteOutline
              ? `rgba(255, 255, 255, ${alpha})`
              : `rgba(252, 205, 188, ${alpha})`;
            const strokeRadius = isCoast ? basePR * 1.06 : basePR * 0.94;
            addPt(strokeBuckets, strokeColor, `stk_${p.type}_${depthBucket}`, px, py, strokeRadius);
            continue;
          }

          // ============ 陆地内部填充粒子（p.type === 1）：保持主题色 rgb(217, 119, 87) ============
          const shade = p.tone * (0.66 + depthBucket * 0.15);
          const rL = Math.min(255, Math.round(217 * shade));
          const gL = Math.min(255, Math.round(119 * shade));
          const bL = Math.min(255, Math.round(87 * shade));
          addPt(baseBuckets, `rgb(${rL}, ${gL}, ${bL})`, `lnd${depthBucket}`, px, py, basePR);
        }

        // 先绘制海洋与陆地内部粒子
        const flushBuckets = (map) => {
          map.forEach((b) => {
            ctx.fillStyle = b.color;
            ctx.beginPath();
            const pts = b.pts;
            const r = b.r;
            for (let j = 0; j < pts.length; j += 2) {
              const x = pts[j], y = pts[j + 1];
              ctx.moveTo(x + r, y);
              ctx.arc(x, y, r, 0, Math.PI * 2);
            }
            ctx.fill();
          });
        };

        flushBuckets(baseBuckets);
        // 再独立叠加绘制描边粒子层（白色或浅主题色），保证大陆与国家边界清晰锐利
        flushBuckets(strokeBuckets);

        // 5. 绘制活跃访客真实位置脉冲信标（按 IP 实际解析出的省市/地区经纬度精准落点）
        const activeBeacons = (dashboard && Array.isArray(dashboard.beacons) && dashboard.beacons.length > 0)
          ? dashboard.beacons
          : (dashboard ? dashboard.countries : []);
        if (globeState.showVisitorBeacons && activeBeacons.length > 0) {
          const maxCountryUv = Math.max(1, ...activeBeacons.map((c) => c.uv));
          activeBeacons.forEach((cStat, idx) => {
            const latR = degToRad(cStat.lat);
            const lonR = degToRad(cStat.lon);
            const wy = Math.sin(latR);
            const rCos = Math.cos(latR);
            const wx = rCos * Math.sin(lonR);
            const wz = rCos * Math.cos(lonR);
            const x1 = wx * cl - wz * sl;
            const z1 = wx * sl + wz * cl;
            const y1 = wy;
            let vx = x1;
            let vy = y1 * cp - z1 * sp;
            const vz = y1 * sp + z1 * cp;
            if (vz <= 0.08) return;
            if (tiltDeg !== 0) {
              const nx = vx * ct - vy * st;
              const ny = vx * st + vy * ct;
              vx = nx; vy = ny;
            }
            const sx = cx + vx * baseRadius;
            const sy = cy - vy * baseRadius;
            const weight = Math.min(1, cStat.uv / maxCountryUv);
            const wave = (globeState.time * 0.9 + idx * 0.27) % 1.0;
            const ringR = 4 + wave * (11 + weight * 11);

            ctx.save();
            ctx.strokeStyle = `rgba(217, 119, 87, ${((1 - wave) * 0.85).toFixed(2)})`;
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.arc(sx, sy, ringR, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(sx, sy, 2.3 + weight * 1.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#d97757';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.restore();
          });
        }

        // 6. 点击国家时的动态 3D 牵引线与悬浮标注框（源自 3d.html）
        if (globeState.clickedCountry) {
          const cc = globeState.clickedCountry;
          const latR = degToRad(cc.clickLat);
          const lonR = degToRad(cc.clickLon);
          const wy = Math.sin(latR);
          const rCos = Math.cos(latR);
          const wx = rCos * Math.sin(lonR);
          const wz = rCos * Math.cos(lonR);
          const x1 = wx * cl - wz * sl;
          const z1 = wx * sl + wz * cl;
          const y1 = wy;
          let vx = x1;
          let vy = y1 * cp - z1 * sp;
          const vz = y1 * sp + z1 * cp;

          if (vz > 0.05) {
            if (tiltDeg !== 0) {
              const nx = vx * ct - vy * st;
              const ny = vx * st + vy * ct;
              vx = nx; vy = ny;
            }
            const sx = cx + vx * baseRadius;
            const sy = cy - vy * baseRadius;
            const age = Math.max(0, globeState.time - (cc.clickedAt || 0));
            const popProgress = Math.min(1.0, age / 0.32);
            const easeOut = 1.0 - Math.pow(1.0 - popProgress, 3);
            const visAlpha = Math.min(1.0, vz / 0.25) * easeOut;
            const cStat = dashboard ? dashboard.countries.find((item) => item.countryZh === cc.zh) : null;

            ctx.save();
            ctx.globalAlpha = visAlpha;

            const ripplePhase = (age * 1.4) % 1.0;
            const rippleRadius = 6 + ripplePhase * 28;
            ctx.strokeStyle = `rgba(217, 119, 87, ${(1.0 - ripplePhase) * 0.9})`;
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.arc(sx, sy, rippleRadius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(sx, sy, 4.0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgb(217, 119, 87)';
            ctx.lineWidth = 2.0;
            ctx.stroke();

            const offsetDirX = vx >= 0 ? 1 : -1;
            const offsetDirY = vy >= 0 ? -1 : 1;
            const elbowX = sx + offsetDirX * 26 * easeOut;
            const elbowY = sy + offsetDirY * 24 * easeOut;
            const endX = elbowX + offsetDirX * 18 * easeOut;
            const endY = elbowY;

            ctx.strokeStyle = 'rgba(255, 235, 225, 0.92)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(elbowX, elbowY);
            ctx.lineTo(endX, endY);
            ctx.stroke();

            const regionLabel = cc.visitorRegion || (cStat && cStat.latestRegion) || '';
            const titleText = regionLabel && regionLabel !== cc.zh
              ? `${cc.zh} · ${regionLabel}`
              : `${cc.zh} · ${cc.en}`;
            const coordLabel = `${Math.abs(cc.clickLat).toFixed(1)}°${cc.clickLat >= 0 ? 'N' : 'S'}, ${Math.abs(cc.clickLon).toFixed(1)}°${cc.clickLon >= 0 ? 'E' : 'W'}`;
            const subText = cStat
              ? `访客 ${cStat.uv} UV · ${cStat.pv} PV (${cStat.share}%) · ${coordLabel}`
              : `${cc.cont} | ${coordLabel}`;
            const ipText = cc.visitorIp
              ? `定位 IP: ${cc.visitorIp}`
              : (cStat ? `最新 IP: ${cStat.latestIp}` : '当前周期暂无访客记录');

            ctx.font = '700 13px "Noto Sans SC", "Microsoft YaHei", sans-serif';
            const w1 = ctx.measureText(titleText).width;
            ctx.font = '500 11px ui-monospace, Consolas, monospace';
            const w2 = ctx.measureText(subText).width;
            const w3 = ctx.measureText(ipText).width;

            const boxW = Math.max(w1, w2, w3) + 24;
            const boxH = 56;
            let boxX = offsetDirX > 0 ? endX + 4 : endX - boxW - 4;
            let boxY = endY - boxH * 0.5;
            boxX = Math.max(12, Math.min(cw - boxW - 12, boxX));
            boxY = Math.max(12, Math.min(ch - boxH - 12, boxY));

            ctx.fillStyle = 'rgba(10, 13, 20, 0.92)';
            ctx.strokeStyle = 'rgb(217, 119, 87)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.roundRect(boxX, boxY, boxW, boxH, 6);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = 'rgb(217, 119, 87)';
            ctx.beginPath();
            ctx.roundRect(boxX + 4, boxY + 6, 3.5, boxH - 12, 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = '700 13px "Noto Sans SC", "Microsoft YaHei", sans-serif';
            ctx.textBaseline = 'top';
            ctx.fillText(titleText, boxX + 13, boxY + 6);

            ctx.fillStyle = '#fccdbc';
            ctx.font = '600 11px ui-monospace, Consolas, monospace';
            ctx.fillText(subText, boxX + 13, boxY + 23);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '400 10.5px ui-monospace, Consolas, monospace';
            ctx.fillText(ipText, boxX + 13, boxY + 39);

            ctx.restore();
          }
        }

        ctx.restore();
        if (!document.hidden) {
          globeState.rafId = requestAnimationFrame(renderGlobeFrame);
        } else {
          globeState.rafId = 0;
        }
      }

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && !globeState.rafId) {
          globeState.lastFrameTime = performance.now();
          globeState.rafId = requestAnimationFrame(renderGlobeFrame);
        }
      });

      let authCsrf = '';

      async function loadServerLogs() {
        const res = await fetch('/api/analytics/raw', { credentials: 'same-origin' });
        if (res.status === 401) { window.location.replace('/studio/'); return false; }
        if (!res.ok) throw new Error('analytics api ' + res.status);
        const data = await res.json();
        visitorLogs = Array.isArray(data.logs) ? data.logs : [];
        if (typeof data.clientIp === 'string' && data.clientIp) {
          currentClientIp = data.clientIp;
        }
        nextLogId = visitorLogs.reduce((max, row) => Math.max(max, Number(row.id) || 0), 0) + 1;
        return true;
      }

      async function initAuth() {
        const res = await fetch('/api/auth/me', { credentials: 'same-origin' });
        if (!res.ok) { window.location.replace('/studio/'); return false; }
        const data = await res.json().catch(() => ({}));
        authCsrf = data.csrf || '';
        return true;
      }

      async function apiWrite(url, method, payload) {
        const res = await fetch(url, {
          method,
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': authCsrf },
          body: payload === undefined ? undefined : JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        return data;
      }

      window.addEventListener('load', async () => {
        decodeCountryGrid();
        buildGlobeParticles(globeState.fibCount);
        wireGlobeControls();
        try {
          if (!(await initAuth())) return;
          if (!(await loadServerLogs())) return;
        } catch (err) {
          toast('读取统计失败：' + (err?.message || err), true);
          return;
        }
        refreshDashboard();
        globeState.lastFrameTime = performance.now();
        globeState.rafId = requestAnimationFrame(renderGlobeFrame);
      });
    })();
  </script>
</body>
</html>
