<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <rect x="6" y="6" width="116" height="116" rx="24" class="bg" />
  <rect x="12" y="12" width="104" height="104" rx="18" class="frame" stroke-width="1.5" stroke-dasharray="4 4" />
  <!-- 夜笙 · 双极流形无限徽标 (Yesheng Bipolar Manifold Infinity Logo) -->
  <path
